name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: macos
            bundles: app
          - os: windows-latest
            name: windows
            bundles: msi
          - os: ubuntu-24.04
            name: linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build application
        if: runner.os != 'macOS'
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: src-tauri
      - name: Build universal macOS application
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo tauri build --bundles app --target universal-apple-darwin
        working-directory: src-tauri
      - name: Prepare macOS release package
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-files
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Claude Usage.app" "release-files/Claude-Usage-macos-universal.zip"
        shell: bash
      - name: Prepare Windows release package
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-files/
        shell: pwsh
      - name: Prepare Linux release package
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-files
          cp src-tauri/target/release/bundle/deb/*.deb release-files/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-${{ matrix.name }}
          path: release-files/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-files/* --title "Claude Usage $RELEASE_TAG" --generate-notes
